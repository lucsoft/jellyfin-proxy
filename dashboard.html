<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>jellyfin-proxy</title>
<style>
  body { font: 13px/1.55 ui-monospace, Menlo, monospace; background: #111; color: #ddd;
         padding: 16px; margin: 0; border-top: 3px solid #444; }
  h1 { font-size: 15px; color: #4af; margin: 0 0 12px; font-weight: 600; }
  pre { background: #1a1a1a; padding: 12px; border-radius: 6px; overflow: auto;
        margin: 0 0 10px; }
  .bar { height: 16px; background: #222; border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
  .fill { height: 100%; transition: width .4s ease; }
  .fill-ahead { background: linear-gradient(90deg, #262, #4d4); }
  .fill-loaded { background: linear-gradient(90deg, #235, #48a); }
  .lbl { color: #777; font-size: 11px; margin-bottom: 10px; display: block; }
  .err { color: #f55; font-weight: 600; }
  .ok { color: #4d4; }
  table { border-collapse: collapse; }
  td { padding: 1px 10px 1px 0; }
  td.k { color: #888; }
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
           gap: 4px; margin: 6px 0 12px; }
  .w { padding: 4px 6px; border-radius: 4px; font-size: 11px; }
  .w.active { background: #1c3a1c; border-left: 3px solid #4d4; }
  .w.idle { background: #1a1a1a; border-left: 3px solid #333; color: #666; }
  .w.err { background: #3a1c1c; border-left: 3px solid #f55; }
  .req { width: 100%; font-size: 11px; }
  .req th { text-align: left; color: #666; font-weight: normal; padding: 2px 8px 2px 0; }
  .req td { padding: 1px 8px 1px 0; white-space: nowrap; }
  .st2 { color: #d84; } .st4 { color: #f55; } .st5 { color: #f55; }
  .ev { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h1>jellyfin-proxy &middot; live</h1>
<div id="out">loading&hellip;</div>

<script>
function el(tag, attrs, text) {
  var e = document.createElement(tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  if (text !== undefined) { e.textContent = text; }
  return e;
}

function bar(pct, cls) {
  var outer = el('div', { class: 'bar' });
  var inner = el('div', { class: 'fill ' + cls });
  inner.style.width = Math.max(0, Math.min(100, pct)) + '%';
  outer.appendChild(inner);
  return outer;
}

function row(k, v) {
  var tr = el('tr');
  tr.appendChild(el('td', { class: 'k' }, k));
  tr.appendChild(el('td', {}, v));
  return tr;
}

function renderPreloader(id, s) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('pre', {}, 'Preloader ' + id));

  var tbl = el('table');
  tbl.appendChild(row('Read-ahead', s.ahead_mb.toFixed(0) + ' MB / ' + s.window_mb.toFixed(0) + ' MB window'));
  tbl.appendChild(row('Read', s.read_pos_mb.toFixed(0) + ' MB'));
  tbl.appendChild(row('Loaded', s.loaded_mb.toFixed(0) + ' MB / ' + s.total_mb.toFixed(0) + ' MB'));
  tbl.appendChild(row('Chunks', String(s.chunks)));
  var st = el('td', { class: s.failed ? 'err' : 'ok' }, s.failed ? 'ERROR' : 'ok');
  var tr = el('tr');
  tr.appendChild(el('td', { class: 'k' }, 'Status'));
  tr.appendChild(st);
  tbl.appendChild(tr);
  frag.appendChild(tbl);

  var aheadPct = s.window_mb > 0 ? (s.ahead_mb / s.window_mb) * 100 : 0;
  var loadedPct = s.total_mb > 0 ? (s.loaded_mb / s.total_mb) * 100 : 0;
  frag.appendChild(bar(aheadPct, 'fill-ahead'));
  frag.appendChild(el('span', { class: 'lbl' }, 'Read-ahead (more is safer)'));
  frag.appendChild(bar(loadedPct, 'fill-loaded'));
  frag.appendChild(el('span', { class: 'lbl' }, 'Portion of the movie loaded'));

  // Worker spans
  if (s.workers && s.workers.length) {
    frag.appendChild(el('div', { class: 'lbl' }, 'Worker connections (' + s.workers.length + ')'));
    var grid = el('div', { class: 'wgrid' });
    s.workers.forEach(function (w, i) {
      if (!w) {
        grid.appendChild(el('div', { class: 'w idle' }, 'w' + i + ' -'));
        return;
      }
      var cls = w.err ? 'w err' : (w.active ? 'w active' : 'w idle');
      var txt = 'w' + w.id + ' @' + w.offset_mb.toFixed(0) + 'MB\n'
              + (w.err ? 'ERR' : (w.active ? (w.ms / 1000).toFixed(1) + 's' : w.mbps.toFixed(0) + ' Mbit'));
      grid.appendChild(el('div', { class: cls }, txt));
    });
    frag.appendChild(grid);
  }

  // Events
  if (s.events && s.events.length) {
    frag.appendChild(el('div', { class: 'lbl' }, 'Recent preload events'));
    var pe = el('pre', { class: 'ev' });
    var lines = [];
    for (var k = Math.max(0, s.events.length - 12); k < s.events.length; k++) {
      var e = s.events[k];
      lines.push(e.at + '  ' + e.kind.padEnd(10) + ' ' + e.detail + '  (' + e.ms + 'ms)');
    }
    pe.textContent = lines.join('\n');
    frag.appendChild(pe);
  }
  return frag;
}

function renderSpans(list) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('div', { class: 'lbl' }, 'Trace spans (tree, newest at bottom)'));

  var byParent = {};
  var roots = [];
  list.forEach(function (sp) {
    (byParent[sp.parent] = byParent[sp.parent] || []).push(sp);
    if (!sp.parent) { roots.push(sp); }
  });

  var pre = el('pre', { class: 'ev' });
  var lines = [];
  var maxMs = 1;
  list.forEach(function (sp) { if (sp.ms > maxMs) { maxMs = sp.ms; } });

  function emit(sp, depth) {
    var indent = new Array(depth + 1).join('  ');
    var barW = Math.max(1, Math.round((sp.ms / maxMs) * 24));
    var bar = '\u2588'.repeat(barW);
    var st = sp.status || (sp.open ? 'OPEN' : '');
    var mk = sp.open ? '\u25CF' : (st === 'err' ? '\u2716' : '\u2714');
    var attrs = '';
    var keys = Object.keys(sp.attrs || {});
    if (keys.length) {
      attrs = '  {' + keys.map(function (k) { return k + '=' + sp.attrs[k]; }).join(' ') + '}';
    }
    lines.push(indent + mk + ' ' + sp.name.padEnd(34) + String(sp.ms).padStart(6) + 'ms '
      + bar + ' ' + st + attrs);
    (byParent[sp.id] || []).forEach(function (c) { emit(c, depth + 1); });
  }

  for (var i = Math.max(0, roots.length - 12); i < roots.length; i++) {
    emit(roots[i], 0);
  }
  pre.textContent = lines.join('\n') || '(no spans yet)';
  frag.appendChild(pre);
  return frag;
}

async function tick() {
  var out = document.getElementById('out');
  try {
    var hRes = await fetch('/proxy/health');
    var sRes = await fetch('/proxy/stats');
    var h = await hRes.json();
    var st = await sRes.json();
    var rq = await (await fetch('/proxy/requests')).json();

    var box = el('div');
    box.appendChild(el('pre', {}, JSON.stringify(h, null, 2)));
    var anyFailed = false;
    for (var id in st) {
      if (st[id].failed) { anyFailed = true; }
      box.appendChild(renderPreloader(id, st[id]));
    }
    box.appendChild(renderSpans(rq || []));
    out.textContent = '';
    out.appendChild(box);
    document.body.style.borderTopColor = anyFailed ? '#f55' : '#4d4';
  } catch (e) {
    out.textContent = 'Error: ' + e;
    document.body.style.borderTopColor = '#f55';
  }
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
